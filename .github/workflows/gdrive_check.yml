name: Google Drive link check

on:
  pull_request:
    paths:
      - "src/data/gallery/**"
      - "src/data/course/**"
      - "scripts/check-gdrive-links.mjs"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/gdrive_check.yml"

permissions:
  contents: read

jobs:
  gdrive-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: yarn
      - run: yarn test:gdrive-links
