name: Gallery link check

on:
  pull_request:
    paths:
      - "src/data/gallery/**"
      - "scripts/check-gallery-links.mjs"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/gallery_check.yml"

permissions:
  contents: read

jobs:
  gallery-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: yarn
      - run: yarn test:gallery-links
