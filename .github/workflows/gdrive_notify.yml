name: Google Drive link maintenance

on:
  schedule:
    # 每週二、三台灣時間 09:17（UTC+8），於當天社課前檢查
    # 兩次間隔皆小於 7 天，避免通知狀態的 cache 因 7 天未存取而被清除
    - cron: "17 1 * * 2,3"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/data/gallery/**"
      - "src/data/course/**"
      - "scripts/check-gdrive-links.mjs"
      - "scripts/notify-gdrive-links.mjs"
      - ".github/workflows/gdrive_check.yml"
      - ".github/workflows/gdrive_notify.yml"
      - "package.json"
      - "yarn.lock"

permissions:
  contents: read

concurrency:
  group: gdrive-link-maintenance-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REPORT_PATH: /tmp/gdrive-link-report.json
  STATE_PATH: .cache/gdrive-link-state.json

jobs:
  gdrive-maintenance:
    # 只在組織 repo 執行，避免 fork 重複檢查或重複發送 Discord 通知
    if: github.repository == 'FCU-iOSClub/Website2022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: yarn
      - name: Prepare state directory
        run: mkdir -p "$(dirname "$STATE_PATH")"
      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: ${{ env.STATE_PATH }}
          key: gdrive-link-state-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            gdrive-link-state-${{ github.repository }}-${{ github.ref_name }}-
      - name: Check Google Drive links
        id: checker
        continue-on-error: true
        run: yarn test:gdrive-links --report "$REPORT_PATH"
      - name: Notify Google Drive link failures
        id: notifier
        if: ${{ always() }}
        env:
          DISCORD_GALLERY_WEBHOOK_URL: ${{ secrets.DISCORD_GALLERY_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: yarn notify-gdrive-links --report "$REPORT_PATH" --state "$STATE_PATH" --workflow-url "$WORKFLOW_URL"
      - name: Save notification state
        if: ${{ always() && steps.notifier.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_PATH }}
          key: gdrive-link-state-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}
      - name: Preserve maintenance result
        if: ${{ always() }}
        run: |
          if [ "${{ steps.checker.outcome }}" != "success" ] || [ "${{ steps.notifier.outcome }}" != "success" ]; then
            exit 1
          fi
